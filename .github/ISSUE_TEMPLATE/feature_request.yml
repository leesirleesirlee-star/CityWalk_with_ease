name: Feature request
description: Suggest an improvement for the planner, the UI, the API or the Chengdu data.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CityWalk with Ease. Before filing, search the existing
        issues and keep the project constraints in mind:

        - the app must stay usable with no API key through the deterministic fallback;
        - the front end remains framework-free (vanilla ES modules) and the runtime has no
          dependencies;
        - Chengdu is the only supported city for now.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? Who is affected, and when?
      placeholder: I want to ... but currently ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behaviour or interface you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds or existing features you considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, examples or references that help explain the request.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I explained the problem, not only the solution.
          required: false
        - label: I considered how this works in the deterministic no-API-key fallback.
          required: false
        - label: No new dependency is proposed, or the request includes why one is needed.
          required: false
